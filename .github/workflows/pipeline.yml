name: Analytics & Report Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas matplotlib seaborn python-docx

    - name: Execute Report Automation
      run: |
        python generate_summary_doc.py

    - name: Commit Updated Deliverables Automatically
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(ci): auto-update generated summary docx"